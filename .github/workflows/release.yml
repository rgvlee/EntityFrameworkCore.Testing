
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish  
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Create NuGet packages
        env:
          RELEASE_VERSION: ${{ github.event.release.name }}
        run: |
          mkdir -p artifacts

          dotnet pack EntityFrameworkCore.Testing.Moq.nuspec \
            --version "$RELEASE_VERSION" \
            --include-symbols \
            --output ./artifacts

          dotnet pack EntityFrameworkCore.Testing.NSubstitute.nuspec \
            --version "$RELEASE_VERSION" \
            --include-symbols \
            --output ./artifacts

      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: rgvlee

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            echo "Publishing $package"

            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate

            symbols="${package%.nupkg}.snupkg"

            if [ -f "$symbols" ]; then
              echo "Publishing symbols: $symbols"

              dotnet nuget push "$symbols" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate
            fi
          done
